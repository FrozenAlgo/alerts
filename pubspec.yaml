name: alerts
description: "OnAlert: Full-Stack IoT Accident Detection System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  firebase_core: ^2.32.0
  # --- MEDIA & UI ---
  video_player: ^2.8.1
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # --- FIREBASE (Hardware & App Sync) ---

  firebase_auth: ^4.18.0
  cloud_firestore: ^4.17.0
  firebase_database: ^10.5.7  # Essential for ESP32 Realtime Data
  firebase_messaging: ^14.9.0

  # --- MAPS & LOCATION ---
  google_maps_flutter: ^2.14.2 # For Live Satellite Tracking
  geolocator: ^11.1.0

  # --- HARDWARE & SYSTEM ---
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2
  vibration: ^2.0.0      # Added: To vibrate phone on crash alert
  sensors_plus: ^5.0.1    # Added: To use phone's internal accelerometer as backup
  google_sign_in: ^7.2.0

  chewie: ^1.8.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/splash_video.mp4 # Ensure this exists in your project folder
    - assets/videos/tut1.mp4